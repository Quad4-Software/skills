# SPDX-License-Identifier: 0BSD
name: mcp-inspector
on:
  push:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'mcp-servers.json'
      - 'scripts/mcp-inspector.py'
      - 'scripts/gen-configs.py'
      - '.github/workflows/mcp-inspector.yml'
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'mcp-servers.json'
      - 'scripts/mcp-inspector.py'
      - 'scripts/gen-configs.py'
      - '.github/workflows/mcp-inspector.yml'

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable
          cache: false
      - name: inspector
        run: make inspector
